<svg xmlns="http://www.w3.org/2000/svg" width="900" height="501" viewBox="0 0 900 501" role="img" aria-label="whoami — about alxshmrv">
  <title>whoami — about alxshmrv</title>
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1124"/>
