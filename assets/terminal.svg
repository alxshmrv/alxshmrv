    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="shade" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="c0"><rect x="134.0" y="50" height="27" width="0"><animate attributeName="width" from="0" to="59.8" begin="0.85s" dur="0.27s" calcMode="discrete" values="0.0;9.6;19.3;28.9;38.5;48.2;57.8" fill="freeze"/></rect></clipPath><clipPath id="c3"><rect x="134.0" y="131" height="27" width="0"><animate attributeName="width" from="0" to="98.3" begin="1.84s" dur="0.45s" calcMode="discrete" values="0.0;9.6;19.3;28.9;38.5;48.2;57.8;67.4;77.1;86.7;96.3" fill="freeze"/></rect></clipPath><clipPath id="c9"><rect x="134.0" y="293" height="27" width="0"><animate attributeName="width" from="0" to="156.1" begin="3.37s" dur="0.72s" calcMode="discrete" values="0.0;9.6;19.3;28.9;38.5;48.2;57.8;67.4;77.1;86.7;96.3;106.0;115.6;125.2;134.8;144.5;154.1" fill="freeze"/></rect></clipPath>
    <style>
