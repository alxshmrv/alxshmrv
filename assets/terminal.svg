  <rect class="glow" x="30" y="24" width="840" height="461" rx="20" fill="url(#border)" filter="url(#shade)"/>
  <rect x="1" y="1" width="898" height="499" rx="16" fill="url(#tbg)" stroke="url(#border)" stroke-opacity="0.6"/>
  <rect x="1" y="1" width="898" height="38" rx="16" fill="#ffffff" fill-opacity="0.04"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="20" r="6" fill="#febc2e"/>
  <circle cx="66" cy="20" r="6" fill="#28c840"/>
  <text x="450.0" y="25" text-anchor="middle" fill="#8b93b8" style="font-size:13px">alx@lab — zsh — 90×15</text>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="0.60s" dur="0.01s" fill="freeze"/><text x="28" y="70"><tspan fill="#22d3ee">alx</tspan><tspan fill="#8b93b8">@</tspan><tspan fill="#f472b6">lab</tspan><tspan fill="#8b93b8">:</tspan><tspan fill="#8b7cff">~</tspan><tspan fill="#8b93b8">$ </tspan></text><text x="134.0" y="70" fill="#ffffff" clip-path="url(#c0)">whoami</text></g>
  <text x="28" y="97" opacity="0" xml:space="preserve"><tspan fill="#8b7cff">→ </tspan><tspan fill="#e2e6ff">Software engineer who ships products end-to-end with AI agents</tspan><animate attributeName="opacity" to="1" begin="1.47s" dur="0.25s" fill="freeze"/></text>
  <g opacity="0"><animate attributeName="opacity" to="1" begin="1.59s" dur="0.01s" fill="freeze"/><text x="28" y="151"><tspan fill="#22d3ee">alx</tspan><tspan fill="#8b93b8">@</tspan><tspan fill="#f472b6">lab</tspan><tspan fill="#8b93b8">:</tspan><tspan fill="#8b7cff">~</tspan><tspan fill="#8b93b8">$ </tspan></text><text x="134.0" y="151" fill="#ffffff" clip-path="url(#c3)">cat now.md</text></g>
  <text x="28" y="178" opacity="0" xml:space="preserve"><tspan fill="#22d3ee">  ▸ </tspan><tspan fill="#e2e6ff">Fitness SaaS in production </tspan><tspan fill="#8b93b8">— .NET API, mobile apps, payments</tspan><animate attributeName="opacity" to="1" begin="2.64s" dur="0.25s" fill="freeze"/></text>
  <text x="28" y="205" opacity="0" xml:space="preserve"><tspan fill="#22d3ee">  ▸ </tspan><tspan fill="#e2e6ff">Маяк </tspan><tspan fill="#8b93b8">— local-first Wi-Fi trust center on Rust + Tauri</tspan><animate attributeName="opacity" to="1" begin="2.76s" dur="0.25s" fill="freeze"/></text>
  <text x="28" y="232" opacity="0" xml:space="preserve"><tspan fill="#22d3ee">  ▸ </tspan><tspan fill="#e2e6ff">Go </tspan><tspan fill="#8b93b8">— digging into game-server internals</tspan><animate attributeName="opacity" to="1" begin="2.88s" dur="0.25s" fill="freeze"/></text>
  <text x="28" y="259" opacity="0" xml:space="preserve"><tspan fill="#22d3ee">  ▸ </tspan><tspan fill="#e2e6ff">Godot </tspan><tspan fill="#8b93b8">— an indie game for desktop &amp; mobile</tspan><animate attributeName="opacity" to="1" begin="3.00s" dur="0.25s" fill="freeze"/></text>
  <g opacity="0"><animate attributeName="opacity" to="1" begin="3.12s" dur="0.01s" fill="freeze"/><text x="28" y="313"><tspan fill="#22d3ee">alx</tspan><tspan fill="#8b93b8">@</tspan><tspan fill="#f472b6">lab</tspan><tspan fill="#8b93b8">:</tspan><tspan fill="#8b7cff">~</tspan><tspan fill="#8b93b8">$ </tspan></text><text x="134.0" y="313" fill="#ffffff" clip-path="url(#c9)">cat workflow.yml</text></g>
  <text x="28" y="340" opacity="0" xml:space="preserve"><tspan fill="#f472b6">  pair_programmer: </tspan><tspan fill="#e2e6ff">Claude Code + Codex</tspan><animate attributeName="opacity" to="1" begin="4.44s" dur="0.25s" fill="freeze"/></text>
  <text x="28" y="367" opacity="0" xml:space="preserve"><tspan fill="#f472b6">  toolbox:         </tspan><tspan fill="#e2e6ff">agents · MCP · skills · hooks</tspan><animate attributeName="opacity" to="1" begin="4.56s" dur="0.25s" fill="freeze"/></text>
  <text x="28" y="394" opacity="0" xml:space="preserve"><tspan fill="#f472b6">  motto:           </tspan><tspan fill="#a3e635">&quot;ship it, measure it, make it better&quot;</tspan><animate attributeName="opacity" to="1" begin="4.68s" dur="0.25s" fill="freeze"/></text>
  <g opacity="0"><animate attributeName="opacity" to="1" begin="4.80s" dur="0.01s" fill="freeze"/><text x="28" y="448"><tspan fill="#22d3ee">alx</tspan><tspan fill="#8b93b8">@</tspan><tspan fill="#f472b6">lab</tspan><tspan fill="#8b93b8">:</tspan><tspan fill="#8b7cff">~</tspan><tspan fill="#8b93b8">$ </tspan></text><rect class="cursor" x="134.0" y="434" width="9.6" height="18" fill="#22d3ee"/></g>
