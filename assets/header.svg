<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="alxshmrv — AI-native software engineer">
  <title>alxshmrv — AI-native software engineer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a14"/>
      <stop offset="1" stop-color="#0d1124"/>
    </linearGradient>

    <linearGradient id="title" x1="200" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="0.35" stop-color="#22d3ee"/>
      <stop offset="0.65" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#8b7cff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-800 0; 0 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="fade" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1200" height="380" fill="url(#fade)"/></mask>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8b7cff" stroke-opacity="0.13" stroke-width="1"/>
    </pattern>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="card"><rect width="1200" height="380" rx="24"/></clipPath>

    <style>
      .blob { mix-blend-mode: screen; }
      .b1 { animation: drift1 14s ease-in-out infinite alternate; }
      .b2 { animation: drift2 18s ease-in-out infinite alternate; }
      .b3 { animation: drift3 16s ease-in-out infinite alternate; }
      @keyframes drift1 { from { transform: translate(0,0) } to { transform: translate(180px,60px) } }
      @keyframes drift2 { from { transform: translate(0,0) } to { transform: translate(-220px,-40px) } }
      @keyframes drift3 { from { transform: translate(0,0) } to { transform: translate(120px,-70px) } }

      .grid { animation: gridmove 8s linear infinite; }
      @keyframes gridmove { from { transform: translate(0,0) } to { transform: translate(40px,40px) } }

      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }

      .title { font-size: 104px; font-weight: 800; letter-spacing: -3px; }
      .sub { font-size: 26px; fill: #c9d1ff; letter-spacing: 1px; }
      .tag { font-size: 15px; fill: #8b93b8; letter-spacing: 3px; }
      .chip text { font-size: 14px; fill: #e2e6ff; }

      .fadeup { opacity: 0; animation: fadeup 1s cubic-bezier(.2,.8,.2,1) forwards; }
      .d1 { animation-delay: .2s } .d2 { animation-delay: .7s } .d3 { animation-delay: 1.1s } .d4 { animation-delay: 1.5s }
      @keyframes fadeup { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: translateY(0) } }

      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }

      .node { animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .n2 { animation-delay: .5s } .n3 { animation-delay: 1s } .n4 { animation-delay: 1.5s } .n5 { animation-delay: 2s } .n6 { animation-delay: 2.5s }
      @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1) } 50% { opacity: 1; transform: scale(1.35) } }

      .edge { stroke-dasharray: 4 6; animation: flow 2.5s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -40 } }

      .scan { animation: scan 5s ease-in-out infinite; }
      @keyframes scan { 0% { transform: translateX(-300px) } 100% { transform: translateX(1500px) } }

      .star { animation: twinkle 4s ease-in-out infinite; }
      @keyframes twinkle { 0%,100% { opacity: .15 } 50% { opacity: .9 } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>

    <!-- aurora -->
    <g filter="url(#blur)" opacity="0.75">
      <circle class="blob b1" cx="200" cy="80" r="170" fill="#6d5dfc"/>
      <circle class="blob b2" cx="1000" cy="300" r="190" fill="#0ea5e9"/>
      <circle class="blob b3" cx="620" cy="360" r="150" fill="#db2777"/>
    </g>

    <!-- moving grid -->
    <g mask="url(#gridMask)">
      <rect class="grid" x="-40" y="-40" width="1280" height="460" fill="url(#grid)"/>
    </g>

    <!-- stars -->
    <g fill="#ffffff">
      <circle class="star" cx="90" cy="300" r="1.6" style="animation-delay:.3s"/>
      <circle class="star" cx="160" cy="210" r="1.2" style="animation-delay:1.3s"/>
      <circle class="star" cx="320" cy="60" r="1.4" style="animation-delay:2.1s"/>
      <circle class="star" cx="470" cy="330" r="1.1" style="animation-delay:.9s"/>
      <circle class="star" cx="780" cy="50" r="1.5" style="animation-delay:1.7s"/>
      <circle class="star" cx="880" cy="340" r="1.2" style="animation-delay:2.6s"/>
      <circle class="star" cx="1120" cy="70" r="1.4" style="animation-delay:.5s"/>
      <circle class="star" cx="60" cy="110" r="1.3" style="animation-delay:3.1s"/>
      <circle class="star" cx="1150" cy="250" r="1.1" style="animation-delay:1.1s"/>
    </g>

    <!-- neural net, left -->
    <g opacity="0.85">
      <g stroke="#8b7cff" stroke-opacity="0.55" stroke-width="1.4" fill="none">
        <path class="edge" d="M70 150 L150 110"/><path class="edge" d="M70 150 L150 190"/>
        <path class="edge" d="M70 230 L150 190"/><path class="edge" d="M70 230 L150 270"/>
        <path class="edge" d="M150 110 L215 170"/><path class="edge" d="M150 190 L215 170"/>
        <path class="edge" d="M150 190 L215 250"/><path class="edge" d="M150 270 L215 250"/>
      </g>
      <g fill="#a5b4fc" filter="url(#glow)">
        <circle class="node" cx="70" cy="150" r="5"/>
        <circle class="node n2" cx="70" cy="230" r="5"/>
        <circle class="node n3" cx="150" cy="110" r="5"/>
        <circle class="node n4" cx="150" cy="190" r="5"/>
        <circle class="node n5" cx="150" cy="270" r="5"/>
        <circle class="node n6" cx="215" cy="170" r="6" fill="#22d3ee"/>
        <circle class="node n2" cx="215" cy="250" r="6" fill="#f472b6"/>
      </g>
      <circle r="3" fill="#fff" filter="url(#glow)">
        <animateMotion dur="2.4s" repeatCount="indefinite" path="M70 150 L150 190 L215 250"/>
      </circle>
      <circle r="3" fill="#fff" filter="url(#glow)">
        <animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M70 230 L150 190 L215 170"/>
      </circle>
    </g>

    <!-- code brackets, right -->
    <g class="mono" font-size="15" fill="#8b93b8" opacity="0.7">
      <text x="950" y="120"><tspan fill="#f472b6">async</tspan> <tspan fill="#22d3ee">Task</tspan> Ship()</text>
      <text x="950" y="145">{</text>
      <text x="970" y="170"><tspan fill="#8b7cff">await</tspan> ai.Plan();</text>
      <text x="970" y="195"><tspan fill="#8b7cff">await</tspan> me.Build();</text>
      <text x="970" y="220"><tspan fill="#8b7cff">await</tspan> prod.Deploy();</text>
      <text x="950" y="245">}</text>
    </g>

    <!-- scanline sweep -->
    <rect class="scan" x="0" y="0" width="160" height="380" fill="#ffffff" opacity="0.035" transform="skewX(-20)"/>

    <!-- text -->
    <g text-anchor="middle">
      <text class="mono tag fadeup d1" x="600" y="98">&lt; HELLO, WORLD /&gt;  ·  ПРИВЕТ, Я</text>
      <g class="fadeup d2" filter="url(#softGlow)">
        <text class="sans title" x="600" y="196" fill="url(#title)">alxshmrv</text>
      </g>
      <text class="mono sub fadeup d3" x="600" y="244">AI-native software engineer<tspan class="cursor" fill="#22d3ee">_</tspan></text>
    </g>

    <!-- chips -->
    <g class="fadeup d4 mono chip">
      <g transform="translate(385 278)">
        <rect width="90" height="32" rx="16" fill="#8b7cff" fill-opacity="0.14" stroke="#8b7cff" stroke-opacity="0.5"/>
        <text x="45" y="21" text-anchor="middle">.NET</text>
      </g>
      <g transform="translate(487 278)">
        <rect width="70" height="32" rx="16" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.5"/>
        <text x="35" y="21" text-anchor="middle">Go</text>
      </g>
      <g transform="translate(569 278)">
        <rect width="80" height="32" rx="16" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.5"/>
        <text x="40" y="21" text-anchor="middle">Rust</text>
      </g>
      <g transform="translate(661 278)">
        <rect width="154" height="32" rx="16" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6" stroke-opacity="0.5"/>
        <text x="77" y="21" text-anchor="middle">LLM agents ✦</text>
      </g>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="379" rx="24" fill="none" stroke="#8b7cff" stroke-opacity="0.35"/>
  </g>
</svg>
